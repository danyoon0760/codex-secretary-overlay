# main에 push하거나 PR을 열면: 빌드 → 자체 테스트 → 설치 스크립트 검사
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # The bubble layout checks assume a desktop-sized screen; runners start at 1024x768.
      - name: Desktop resolution
        shell: powershell
        run: |
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
          Add-Type -AssemblyName System.Windows.Forms
          [System.Windows.Forms.Screen]::PrimaryScreen.Bounds

      - name: Build
        run: dotnet build -c Release -nologo

      - name: Self-test
        shell: pwsh
        run: ./installer/Run-SelfTest.ps1

      - name: Installer scripts (PowerShell 7)
        shell: pwsh
        run: |
          ./installer/HookScriptsVerification.ps1
          ./installer/InstallVerification.ps1

      - name: Installer scripts (Windows PowerShell 5.1)
        shell: powershell
        run: |
          ./installer/HookScriptsVerification.ps1
          ./installer/InstallVerification.ps1
