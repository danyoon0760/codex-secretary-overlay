# v로 시작하는 태그(예: v0.2.0)를 올리면: 테스트 → 배포 ZIP 만들기 → GitHub Release에 업로드
# 릴리스 본문의 변경 내용은 CHANGELOG.md의 같은 버전 항목에서 가져온다.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Version from tag
        shell: pwsh
        run: |
          $v = "$env:GITHUB_REF_NAME".TrimStart('v')
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Tag must look like v1.2.3 (got $env:GITHUB_REF_NAME)" }
          $project = ([xml](Get-Content -Raw SecretaryOverlay.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ($project -ne $v) { throw "Tag $v does not match <Version>$project</Version> in SecretaryOverlay.csproj" }
          "VERSION=$v" >> $env:GITHUB_ENV

      # The bubble layout checks assume a desktop-sized screen; runners start at 1024x768.
      - name: Desktop resolution
        shell: powershell
        run: |
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
          Add-Type -AssemblyName System.Windows.Forms
          [System.Windows.Forms.Screen]::PrimaryScreen.Bounds

      - name: Build
        run: dotnet build -c Release -nologo

      - name: Self-test
        shell: pwsh
        run: ./installer/Run-SelfTest.ps1

      - name: Installer scripts
        shell: powershell
        run: |
          ./installer/HookScriptsVerification.ps1
          ./installer/InstallVerification.ps1

      - name: Package
        shell: pwsh
        run: ./installer/Build-Release.ps1 -Version $env:VERSION

      - name: Release notes
        shell: pwsh
        run: |
          $lines = Get-Content -Encoding utf8 CHANGELOG.md
          $start = [Array]::FindIndex($lines, [Predicate[string]]{ param($l) $l -match "^## \[$([regex]::Escape($env:VERSION))\]" })
          if ($start -lt 0) { throw "CHANGELOG.md has no section for $env:VERSION" }
          $end = [Array]::FindIndex($lines, $start + 1, [Predicate[string]]{ param($l) $l -match '^## ' })
          if ($end -lt 0) { $end = $lines.Count }
          $changes = $lines[($start + 1)..($end - 1)] -join "`n"
          $hash = (Get-FileHash dist/SecretaryOverlay-win-x64.zip -Algorithm SHA256).Hash
          $notes = @(
            $changes.Trim()
            ''
            '## 설치'
            '1. 아래 **Assets**에서 `SecretaryOverlay-win-x64.zip`을 받아 압축을 풉니다.'
            '2. `Install.cmd`를 실행합니다. 관리자 권한이나 별도 .NET 설치는 필요하지 않습니다.'
            '3. Codex **설정 → Hook**에서 새 `Secretary pet` 후크 12개를 신뢰 처리합니다.'
            ''
            'Windows 10 2004 이상 또는 Windows 11 x64와 Codex 데스크톱 앱이 필요합니다. AI 기능에는 Codex CLI가 필요합니다.'
            '이 배포본은 코드 서명이 되어 있지 않아 Windows 보안 경고가 표시될 수 있습니다.'
            ''
            "SHA-256 (SecretaryOverlay-win-x64.zip): ``$hash``"
          )
          $notes -join "`n" | Out-File -Encoding utf8 release-notes.md

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create $env:GITHUB_REF_NAME
          dist/SecretaryOverlay-win-x64.zip dist/SecretaryOverlay-win-x64.zip.sha256
          --title "v$env:VERSION Windows x64" --notes-file release-notes.md --verify-tag
